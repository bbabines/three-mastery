<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <style>
      html, body { margin: 0; background: #15171c; color: #d8dbe2; font: 15px/1.6 system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
      nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box; padding: 20px 12px 40px; border-right: 1px solid #2c2f36; }
      nav .home { display: block; color: #d8dbe2; font-weight: 600; text-decoration: none; margin: 0 4px 10px; }
      nav .nav-tools { display: flex; gap: 14px; margin: 0 4px 12px; }
      nav .nav-tools button { background: none; border: none; padding: 0; color: #8a8f99; font-size: 12px; cursor: pointer; }
      nav .nav-tools button:hover { color: #d8dbe2; }
      nav details > summary { list-style: none; display: flex; align-items: baseline; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
      nav details > summary::-webkit-details-marker { display: none; }
      nav details > summary::before { content: '▸'; flex: none; width: 10px; color: #6b7079; font-size: 10px; transition: transform 0.15s; }
      nav details[open] > summary::before { transform: rotate(90deg); }
      nav details > summary:hover { background: #1e2127; }
      nav details.loop { margin-bottom: 6px; }
      nav details.loop > summary { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8f99; }
      nav details.domain > summary { font-size: 13px; line-height: 1.35; color: #d8dbe2; }
      nav details.loop details.domain { margin-left: 8px; }
      nav details.elective { margin-top: 10px; border-top: 1px solid #2c2f36; padding-top: 10px; }
      nav .count { margin-left: auto; padding-left: 8px; color: #6b7079; font-size: 11px; }
      nav a.drill, nav .upcoming { display: block; padding: 4px 8px 4px 24px; border-radius: 6px; font-size: 13px; line-height: 1.35; }
      nav a.drill { color: #b8bcc6; text-decoration: none; }
      nav a.drill:hover { background: #1e2127; }
      nav a.drill[aria-current] { background: #262a33; color: #fff; }
      nav a.drill.done::after { content: ' ✓'; color: #22c55e; }
      nav .count { white-space: nowrap; }
      .done { color: #22c55e; }
      nav .upcoming { color: #585d67; cursor: default; }
      nav .upcoming .detail { color: #484c55; font-size: 11px; }
      nav details.loop > .upcoming { padding-left: 18px; }
      nav .note { margin: 2px 8px 6px 24px; color: #6b7079; font-size: 12px; line-height: 1.4; }
      nav #pace { position: sticky; bottom: -40px; margin: 16px -12px -40px; padding: 10px 18px 14px; background: #15171c; border-top: 1px solid #2c2f36; font-size: 12px; }
      nav #pace p { display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; color: #b8bcc6; }
      nav #pace .pace-title { color: #8a8f99; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      article { padding: 28px 32px 64px; max-width: 760px; }
      article h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; }
      article .meta { color: #8a8f99; font-size: 13px; margin: 0 0 8px; }
      article blockquote { margin: 16px 0 8px; padding: 4px 18px; background: #1c1f25; border-left: 3px solid #8ab4ff; border-radius: 0 8px 8px 0; }
      article blockquote p { margin: 10px 0; }
      article h2 { font-size: 19px; margin: 0; }
      details.section { border-top: 1px solid #2c2f36; margin-top: 24px; }
      details.section > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 20px 0 6px; cursor: pointer; }
      details.section > summary::-webkit-details-marker { display: none; }
      details.section > summary::before { content: '▸'; color: #8a8f99; transition: transform 0.15s; }
      details.section[open] > summary::before { transform: rotate(90deg); }
      details.section > summary:hover h2 { color: #fff; }
      article h3 { font-size: 15px; color: #fff; margin: 28px 0 4px; }
      article a { color: #8ab4ff; }
      article code { background: #22252c; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
      article pre { background: #1c1f25; padding: 12px; border-radius: 6px; overflow-x: auto; }
      article pre code { background: none; padding: 0; }
      article li { margin: 4px 0; }
      article table { border-collapse: collapse; margin: 12px 0; font-size: 14px; }
      article th, article td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid #2c2f36; }
      article th { color: #8a8f99; font-weight: 500; }
      article details:not(.section) { background: #1c1f25; border-radius: 6px; padding: 8px 12px; margin: 12px 0; }
      article details:not(.section) > summary { cursor: pointer; color: #b8bcc6; }
      button { font: inherit; }
      .scene { position: relative; height: 380px; margin: 16px 0; border-radius: 8px; overflow: hidden; }
      .scene canvas { display: block; }
      .readout { position: absolute; top: 10px; left: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(21, 23, 28, 0.85); font: 12px/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none; }
      .controls { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 8px 10px; border-radius: 6px; background: rgba(21, 23, 28, 0.85); font-size: 13px; }
      .controls label { display: flex; align-items: center; gap: 6px; }
      .controls input[type="range"] { width: 110px; }
      .controls button { background: #22252c; border: 1px solid #3a3f4a; color: #d8dbe2; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .controls button[aria-pressed="true"] { border-color: #8ab4ff; }
      .controls button code { background: none; padding: 0; }
      .question { background: #1c1f25; border-radius: 8px; padding: 4px 16px 12px; margin: 16px 0; }
      .question .number { color: #8a8f99; font-size: 12px; margin: 10px 0 0; }
      .question pre { background: #15171c; white-space: pre-wrap; }
      .question .ask { font-weight: 600; margin: 8px 0; }
      .choices { display: grid; gap: 6px; }
      .choices button { text-align: left; background: #22252c; border: 1px solid #3a3f4a; color: #d8dbe2; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
      .choices button:disabled { cursor: default; opacity: 0.6; }
      .choices button.correct { border-color: #22c55e; opacity: 1; }
      .choices button.wrong { border-color: #ef4444; opacity: 1; }
      .why { margin: 10px 0 0; }
      .score { font-weight: 600; }
      @media (max-width: 900px) {
        body { grid-template-columns: minmax(0, 1fr); }
        nav { position: static; height: auto; border-right: none; border-bottom: 1px solid #2c2f36; }
        article { padding: 20px 16px 48px; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="home" href="/">three.js foundations</a>
      <div id="drills"></div>
      <div id="pace"></div>
    </nav>
    <article id="drill"></article>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
